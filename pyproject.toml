[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "wow-goldmaking-intelligence"
version = "0.1.0"
description = "Données économiques WoW traçables : ingestion TSM et API locale"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "pydantic-settings>=2.6,<3", "SQLAlchemy>=2.0,<3",
  "alembic>=1.14,<2", "httpx>=0.28,<1", "uvicorn>=0.32,<1", "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "mypy>=1.14,<2"]

[project.scripts]
goldmaking = "goldmaking.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: nécessite TEST_POSTGRES_URL"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]
